name: Docker

on:
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify native-password login and query the Formula 1 database
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          docker run -d --name f1db -p 127.0.0.1:3346:3306 \
            -e MYSQL_ROOT_PASSWORD=f1db -e MYSQL_DATABASE=f1db "$IMAGE"
          for attempt in {1..90}; do
            if docker exec -e MYSQL_PWD=f1db f1db mysql --protocol=tcp -h 127.0.0.1 -uroot -e 'SELECT 1'; then
              break
            fi
            sleep 2
          done
          docker exec -e MYSQL_PWD=f1db f1db mysql -uroot -e \
            "CREATE USER 'tableau'@'%' IDENTIFIED WITH mysql_native_password BY 'test-only';
             GRANT SELECT, SHOW VIEW ON f1db.* TO 'tableau'@'%';"
          result=$(docker run --rm --network host -e MYSQL_PWD=test-only "$IMAGE" \
            mysql --protocol=tcp -h 127.0.0.1 -P 3346 -utableau --default-auth=mysql_native_password \
            --batch --skip-column-names -e 'SELECT COUNT(*) > 0 FROM f1db.races;')
          test "$result" = 1
